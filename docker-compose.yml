services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: context-hub-api
    working_dir: /app
    ports:
      - "${NODE_PORT:-3000}:3000"
    command: ["pnpm", "dev"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Hide host Postgres data from the API bind mount.
      - api_db_ignore:/app/db
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NODE_HOST=${NODE_HOST:-0.0.0.0}
      - NODE_PORT=${NODE_PORT:-3000}
      - NODE_LOG_LEVEL=${NODE_LOG_LEVEL:-info}
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - context-hub
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: context-hub-worker
    working_dir: /app
    command: ["pnpm", "dev:worker"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_db_ignore:/app/db
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NODE_LOG_LEVEL=${NODE_LOG_LEVEL:-info}
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - context-hub
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    # pgvector-enabled Postgres (same major as before: 16)
    image: pgvector/pgvector:pg16
    container_name: context-hub-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - context-hub

  redis:
    image: redis:7-alpine
    container_name: context-hub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - context-hub

volumes:
  node_modules:
  api_db_ignore:

networks:
  context-hub:
    driver: bridge
